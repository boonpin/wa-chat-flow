  <text x="500" y="482" class="meta">09:18</text>
  <text x="296" y="506" class="secondary">Thank you for the update.</text>
  <rect x="296" y="519" width="63" height="22" rx="6" fill="#F1F5F9"/>
  <text x="305" y="534" class="small secondary">Human</text>
  <text x="370" y="535" class="meta">Support</text>
  <path d="M292 558H536" stroke="#E8EDE9"/>
