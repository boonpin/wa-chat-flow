  <text x="664" y="1005" class="secondary">Connection, mode and outcome</text>
  <text x="664" y="1028" class="meta">Shown as separate facts</text>
  <rect x="968" y="876" width="312" height="172" rx="12" fill="#FFF" stroke="#DDE4DF"/>
  <text x="984" y="904" class="strong">Recover without losing work</text>
  <rect x="984" y="920" width="280" height="70" rx="8" fill="#FEF3F2"/>
