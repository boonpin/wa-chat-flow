  <text x="76" y="600" class="secondary">WhatsApp channels</text>
  <path d="M60 625H252" stroke="#DDE4DF"/>
  <text x="76" y="658" class="secondary">Activity</text>
  <text x="76" y="698" class="secondary">Settings</text>
  <text x="76" y="738" class="secondary">Help</text>
  <text x="60" y="778" class="meta">Account / Sign out</text>
  <text x="296" y="159" style="font-size:28px" class="strong">Inbox</text>
  <text x="296" y="187" class="secondary">Read the conversation. See who will reply.</text>
  <rect x="1020" y="143" width="236" height="32" rx="8" fill="#FFFBEB"/>
  <text x="1032" y="164" style="fill:#92400E;font-size:12px">WhatsApp · Needs attention</text>
  <path d="M272 212H1280" stroke="#DDE4DF"/>
  <path d="M560 212V800" stroke="#DDE4DF"/>
