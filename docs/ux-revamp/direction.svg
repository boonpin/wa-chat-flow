  <text x="584" y="247" style="font-size:20px" class="strong">Sample customer</text>
  <text x="584" y="270" class="meta">Sales · Reported connected</text>
  <rect x="1168" y="232" width="88" height="40" rx="8" fill="#087F5B"/>
  <text x="1188" y="257" class="white strong">Resolve</text>
  <rect x="584" y="285" width="106" height="24" rx="6" fill="#EFF6FF"/>
  <text x="594" y="301" class="blue small strong">Reply mode: AI</text>
  <text x="704" y="302" class="secondary">Bot: Sales assistant</text>
  <text x="1109" y="302" class="green small">Use human replies</text>
  <rect x="584" y="328" width="672" height="76" rx="8" fill="#FFFBEB"/>
  <text x="600" y="352" style="fill:#92400E;font-weight:600">AI replies are paused globally.</text>
  <text x="600" y="376" style="fill:#92400E">You can still receive messages and reply manually.</text>
  <text x="1104" y="389" style="fill:#92400E;font-size:12px;text-decoration:underline">Review reply settings</text>
  <text x="898" y="433" class="meta">Today</text>
  <rect x="584" y="454" width="376" height="72" rx="12" fill="#F3F6F4"/>
  <text x="600" y="480" style="font-size:16px">Could someone help me choose a service?</text>
  <text x="916" y="510" class="meta">09:24</text>
  <path d="M788 583L792 587L800 577" fill="none" stroke="#166534" stroke-width="1.7"/>
  <text x="810" y="587" class="meta">Customer details saved here</text>
  <text x="1115" y="587" class="green small">View capture</text>
  <path d="M560 652H1280" stroke="#DDE4DF"/>
  <text x="584" y="680" class="strong">Reply as a human</text>
  <rect x="584" y="694" width="672" height="88" rx="8" fill="#F3F6F4" stroke="#7E8D85"/>
  <text x="600" y="721" style="font-size:16px">Of course. What would you like to use it for?</text>
  <text x="600" y="761" class="meta">Enter to send · Shift+Enter for a new line</text>
  <rect x="1160" y="730" width="80" height="40" rx="8" fill="#087F5B"/>
  <text x="1184" y="755" class="white strong">Send</text>
  <text x="40" y="852" style="font-size:20px" class="strong">One shared visual language</text>
  <rect x="40" y="876" width="288" height="172" rx="12" fill="#FFF" stroke="#DDE4DF"/>
  <text x="56" y="904" class="strong">Readable, restrained color</text>
  <rect x="56" y="922" width="44" height="32" rx="6" fill="#182C23"/>
  <rect x="108" y="922" width="44" height="32" rx="6" fill="#087F5B"/>
  <rect x="160" y="922" width="44" height="32" rx="6" fill="#1D4ED8"/>
  <rect x="212" y="922" width="44" height="32" rx="6" fill="#92400E"/>
  <text x="56" y="980" class="secondary">Dark ink · Green action · Blue AI</text>
  <text x="56" y="1005" class="meta">Primary button text contrast 5.00:1</text>
  <text x="56" y="1028" class="meta">Color always paired with words</text>
  <rect x="344" y="876" width="288" height="172" rx="12" fill="#FFF" stroke="#DDE4DF"/>
  <text x="360" y="904" class="strong">A clear reading order</text>
  <text x="360" y="946" style="font-size:28px" class="strong">Customer first</text>
  <text x="360" y="976" style="font-size:16px">Comfortable conversation text</text>
  <text x="360" y="1002" class="secondary">Compact controls and operational rows</text>
  <text x="360" y="1028" class="meta">28px title · 16px message · 14px UI</text>
  <rect x="648" y="876" width="304" height="172" rx="12" fill="#FFF" stroke="#DDE4DF"/>
  <text x="664" y="904" class="strong">States carry meaning</text>
  <rect x="664" y="920" width="99" height="24" rx="6" fill="#F0FDF4"/>
  <text x="674" y="936" style="fill:#166534;font-size:12px">Connected</text>
  <rect x="775" y="920" width="100" height="24" rx="6" fill="#EFF6FF"/>
  <text x="785" y="936" class="blue small">AI replies</text>
  <rect x="664" y="954" width="99" height="24" rx="6" fill="#F1F5F9"/>
  <text x="674" y="970" class="small secondary">Human replies</text>
  <rect x="775" y="954" width="100" height="24" rx="6" fill="#FEF3F2"/>
