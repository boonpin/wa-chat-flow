  <text x="996" y="969" style="fill:#B42318">Your edits are still here. Try again.</text>
  <text x="984" y="1028" class="meta">Persistent error · Clear next action</text>
  <text x="40" y="1084" class="meta">Static composition study · Source Sans 3 proposed; portable font fallback used when unavailable · See design-system.md for full responsive and interaction contracts</text>
</svg>
