<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120" role="img" aria-labelledby="title desc">
  <title id="title">WA Robot proposed visual direction</title>
  <desc id="desc">A light operational workspace with grouped navigation, conversation list and reply status separating WhatsApp connection, AI mode and globally paused AI replies. Below are palette and component specimens. All conversation content is illustrative. This is a static proposal, not implemented UI.</desc>
  <defs>
    <style>
      text{font-family:"Source Sans 3",Arial,sans-serif;fill:#182C23;font-size:14px}
      .secondary{fill:#43564C}.meta{fill:#64716B;font-size:12px}.label{font-size:12px;font-weight:600;fill:#64716B}.strong{font-weight:600}.title{font-size:28px;font-weight:600;letter-spacing:-.5px}.white{fill:#FFF}.small{font-size:12px}.green{fill:#087F5B}.blue{fill:#1D4ED8}
    </style>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#182C23" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1320" height="1120" fill="#F8FAF9"/>
  <text x="40" y="53" class="title">A clear view of every customer conversation.</text>
  <text x="40" y="82" class="secondary">WA Robot · Phase 1 direction specimen · Illustrative content, not an implemented screen</text>
  <rect x="40" y="120" width="1240" height="680" rx="12" fill="#FFF" stroke="#DDE4DF" filter="url(#lift)"/>
  <path d="M52 120H272V800H52Q40 800 40 788V132Q40 120 52 120" fill="#F8FAF9"/>
  <path d="M272 120V800" stroke="#DDE4DF"/>
  <rect x="60" y="144" width="28" height="28" rx="8" fill="#087F5B"/>
  <path d="M67 151H81V161H73L69 165V161H67Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="100" y="163" class="strong">WA Robot</text>
  <text x="60" y="207" class="label">Work</text>
  <text x="76" y="238" class="secondary">Overview</text>
  <rect x="52" y="250" width="208" height="40" rx="8" fill="#E4F2EA"/>
  <rect x="52" y="262" width="3" height="16" rx="1.5" fill="#087F5B"/>
  <text x="76" y="275" class="strong">Inbox</text>
  <text x="76" y="318" class="secondary">Contacts</text>
  <text x="60" y="366" class="label">Automation</text>
  <text x="76" y="398" class="secondary">AI bots</text>
  <text x="76" y="438" class="secondary">Tools</text>
  <text x="76" y="478" class="secondary">Reply settings</text>
  <text x="76" y="518" class="secondary">Campaigns</text>
