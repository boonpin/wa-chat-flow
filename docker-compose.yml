# WA Chat Flow — application only.
#
# WAHA is deployed separately (see ./waha), so this file defines just the app.
# The two connect over a shared Docker network when they run on the same host:
#
#   Internet ──► wa-chat-flow (:3000) ──► waha (private network, never public)
#
# Bring WAHA up first — it creates the network this compose file joins:
#   cd waha && docker compose up -d
#   cd ..   && docker compose up -d --build

services:
  app:
    build: .
    image: wa-chat-flow
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /storage/app
      # Where to reach WAHA's REST API. With the shared network below, this is
      # the WAHA service name: http://waha:3000
      WAHA_BASE_URL: ${WAHA_BASE_URL:?set WAHA_BASE_URL in .env}
      # Where WAHA should POST events. Must be reachable *from the WAHA
      # container* — on the shared network that is this service's own name.
      WAHA_WEBHOOK_URL: ${WAHA_WEBHOOK_URL:-http://app:3000/api/webhooks/waha}
    volumes:
      - ./storage/app:/storage/app
    ports:
      - "3000:3000"
    networks:
      - default
      - waha

networks:
  # Created by ./waha/docker-compose.yml. If you renamed that project directory,
  # set WAHA_NETWORK to match (`docker network ls` shows the real name).
  #
  # Running WAHA on a DIFFERENT host instead? Delete this block and the
  # `networks:` key above, and point WAHA_BASE_URL / WAHA_WEBHOOK_URL at private
  # addresses — never expose WAHA's API to the internet.
  waha:
    external: true
    name: ${WAHA_NETWORK:-waha_default}
